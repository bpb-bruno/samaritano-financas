{% extends "layout.html" %}

{% block title %} Vender {% endblock %}

{% block main %}
    <form action="/sell" method="post">
        <div class="mb-3">
            <select class="form-select mx-auto w-auto" name="symbol">
                <option disabled selected>Selecione a Ação</option>
                {% for stock in stocks %}
                    <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="shares" placeholder="Quantidade" type="number" min="1">
        </div>
        <button class="btn btn-primary" type="submit">Vender</button>
    </form>
{% endblock %}
