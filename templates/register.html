{% extends "layout.html" %}

{% block title %} Criar Conta {% endblock %}

{% block main %}
    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Informe o usuário" type="text" required>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Senha" type="password" required>
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="confirmation" placeholder="Confirme sua senha" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit">Registrar</button>
    </form>
{% endblock %}
